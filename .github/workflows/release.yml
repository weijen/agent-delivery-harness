name: Release

# Automated SemVer release for the harness (issue #257). On every push to main,
# python-semantic-release computes the next version from the Conventional Commits
# landed since the last tag, updates pyproject.toml [project].version, mirrors it
# into the root VERSION file (build_command = scripts/sync-version.sh), writes
# CHANGELOG.md, commits, tags, and creates a GitHub Release. It is a no-op when
# only chore/docs/test/etc. commits landed (no releasable change).
#
# This is NOT PyPI publishing (out of scope): the harness is not a distributed
# package, so no build artifacts are uploaded.

on:
  push:
    branches:
      - main

# Least privilege by default; the release job opts up to contents: write.
permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    # Prevent racing release jobs if several pushes land on main in quick
    # succession — each must see the tag the previous one wrote.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      # PSR pushes the version-bump commit + tag and creates the GitHub Release.
      contents: write

    steps:
      - name: Checkout repository on the release branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Guard against the branch advancing while this job was queued: only
      # release the commits that actually triggered this run.
      - name: Pin release branch to the triggering sha
        run: git reset --hard ${{ github.sha }}

      - name: Semantic version release
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Create GitHub Release
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      # Safety net for issue #455: the PSR docker action has no uv, so the
      # build_command's guarded refresh cannot run there and the release commit
      # may land with a stale uv.lock — which reds the Python-lock-integrity
      # required check for EVERY subsequent PR until a manual chore lands
      # (0.39.0/0.40.0/0.40.1/0.43.0 all hit this). When the lock is already
      # consistent (a uv-capable release path refreshed it) this commits
      # nothing.
      - name: Sync uv.lock with the released version
        if: steps.release.outputs.released == 'true'
        run: |
          set -euo pipefail
          git pull --ff-only origin "${{ github.ref_name }}"
          python3 -m pip install --quiet uv==0.8.6
          if uv lock --check >/dev/null 2>&1; then
            echo "uv.lock already consistent with the release bump"
            exit 0
          fi
          uv lock
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release): sync uv.lock for ${{ steps.release.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
