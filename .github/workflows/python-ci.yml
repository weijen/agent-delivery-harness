name: Python CI

# Harness Smoke owns the Python profile gates. This workflow remains as a
# distinct required-check shell and verifies only dependency-lock integrity.

on:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"

jobs:
  python-lock:
    name: Python lock integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache verified uv archive and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/harness-ci-tools/uv-*.tar
            ~/.cache/uv
          key: ci-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install/install-ci-tool.sh', 'uv.lock') }}

      - name: Set up uv
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/install-ci-tool.sh uv

      - name: Verify dependency lock
        run: uv lock --check
