name: Python CI

# Harness Smoke owns the Python profile gates. This workflow remains as a
# distinct required-check shell and verifies only dependency-lock integrity.

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-lock:
    name: Python lock integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Verify dependency lock
        run: uv lock --check
