name: Harness Smoke

on:
  pull_request:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  smoke:
    name: Harness smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum --check -
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          sudo install \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          shellcheck --version

      - name: Detect Python product surface
        id: python_surface
        shell: bash
        run: |
          set -euo pipefail
          source profiles/python.profile.sh
          if profile_detect; then
            echo 'applicable=true' >>"$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            echo 'applicable=false' >>"$GITHUB_OUTPUT"
            echo 'No applicable Python product surface; release/lock checks are independent.'
          fi

      - name: Set up uv
        id: python_setup
        if: steps.python_surface.outputs.applicable == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Sync Python environment
        id: python_sync
        if: steps.python_surface.outputs.applicable == 'true'
        run: |
          uv sync --all-groups

      - name: Python profile gates
        id: python_gates
        if: steps.python_surface.outputs.applicable == 'true'
        run: |
          ./scripts/validation/python-gates.sh

      - name: Check shell syntax
        run: ./scripts/validation/check-shell.sh syntax

      - name: Run shellcheck
        run: ./scripts/validation/check-shell.sh lint

      - name: Validate customization frontmatter
        shell: bash
        run: bash tests/evals/bin/validate-customization-frontmatter.sh
      - name: Run harness sensor suite
        id: core_sensors
        shell: bash
        env:
          SENSOR_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/run-sensors.sh --gate ci --diff "${SENSOR_DIFF_BASE:?pull request base is required}"
