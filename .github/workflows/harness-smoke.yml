name: Harness Smoke

on:
  pull_request:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  smoke:
    name: Harness smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Cache verified ShellCheck archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/harness-ci-tools/shellcheck-*.tar
          key: ci-shellcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install/install-ci-tool.sh') }}

      - name: Install shellcheck
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/install-ci-tool.sh shellcheck

      - name: Detect Python product surface
        id: python_surface
        shell: bash
        run: |
          set -euo pipefail
          source profiles/python.profile.sh
          if profile_detect; then
            echo 'applicable=true' >>"$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            echo 'applicable=false' >>"$GITHUB_OUTPUT"
            echo 'No applicable Python product surface; release/lock checks are independent.'
          fi

      - name: Cache verified uv archive and dependencies
        if: steps.python_surface.outputs.applicable == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/harness-ci-tools/uv-*.tar
            ~/.cache/uv
          key: ci-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install/install-ci-tool.sh', 'uv.lock') }}

      - name: Set up uv
        id: python_setup
        if: steps.python_surface.outputs.applicable == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/install-ci-tool.sh uv

      - name: Sync Python environment
        id: python_sync
        if: steps.python_surface.outputs.applicable == 'true'
        run: |
          uv sync --all-groups

      - name: Python profile gates
        id: python_gates
        if: steps.python_surface.outputs.applicable == 'true'
        run: |
          ./scripts/validation/python-gates.sh static

      - name: Check shell syntax
        run: ./scripts/validation/check-shell.sh syntax

      - name: Run shellcheck
        run: ./scripts/validation/check-shell.sh lint

      - name: Validate customization frontmatter
        shell: bash
        run: bash tests/evals/bin/validate-customization-frontmatter.sh
      - name: Run harness sensor suite
        id: core_sensors
        shell: bash
        env:
          SENSOR_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ./scripts/validation/validate.sh bash -euo pipefail <<'SH'
          if ./scripts/validation/python-gates.sh test; then
            :
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
          fi
          ./scripts/run-sensors.sh --gate ci --diff "${SENSOR_DIFF_BASE:?pull request base is required}"
          SH
